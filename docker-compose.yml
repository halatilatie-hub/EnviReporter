version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: envireporter-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    stdin_open: true
    tty: true
